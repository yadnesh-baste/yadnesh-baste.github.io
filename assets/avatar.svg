    <path d="M110 450 C150 420 180 410 200 406" fill="none" stroke="#3E5282" stroke-width="3" opacity=".35" stroke-linecap="round"/>

    <path d="M338 452 L378 446 L374 462 L342 466 Z" fill="#1A2540"/>
    <path d="M344 452 L352 438 L360 450 L368 436 L374 448 Z" fill="#7FA0C8"/>
    <path d="M344 452 L352 438 L360 450" fill="none" stroke="#A9C1DE" stroke-width="1.5"/>
