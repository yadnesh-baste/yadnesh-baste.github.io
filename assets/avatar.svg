<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Illustrated avatar of Yadnesh Baste">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#EAF1F8"/><stop offset="1" stop-color="#AFC4DC"/></radialGradient>
    <radialGradient id="skin" cx="44%" cy="36%" r="70%"><stop offset="0" stop-color="#DDA175"/><stop offset=".55" stop-color="#C08150"/><stop offset="1" stop-color="#94572F"/></radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7E4625"/><stop offset=".5" stop-color="#A2643B"/><stop offset="1" stop-color="#B17147"/></linearGradient>
    <radialGradient id="ear" cx="40%" cy="40%" r="70%"><stop offset="0" stop-color="#CC8C5D"/><stop offset="1" stop-color="#93562F"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A362B"/><stop offset=".45" stop-color="#241913"/><stop offset="1" stop-color="#150F0B"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1510" stop-opacity=".95"/><stop offset="1" stop-color="#2A1D16" stop-opacity=".35"/></linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E211A" stop-opacity=".75"/><stop offset=".35" stop-color="#22180F"/><stop offset="1" stop-color="#140E0A"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34466E"/><stop offset=".55" stop-color="#1F2C4A"/><stop offset="1" stop-color="#141D33"/></linearGradient>
    <linearGradient id="lapel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2540"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DADDE2"/></linearGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#7A4A2C"/><stop offset=".7" stop-color="#3E2416"/><stop offset="1" stop-color="#1C110A"/></radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="shade" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5A2E14" stop-opacity=".45"/><stop offset="1" stop-color="#5A2E14" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1426" flood-opacity=".28"/></filter>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
    <clipPath id="face"><path d="M162 232 C160 152 200 110 256 110 C312 110 352 152 350 232 C350 302 316 354 256 358 C196 354 162 302 162 232 Z"/></clipPath>
  </defs>
