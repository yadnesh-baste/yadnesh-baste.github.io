    <path d="M352 240 C360 196 354 158 336 134 C332 170 336 204 340 236 Z" fill="url(#fade)"/>
    <path d="M168 190 C164 140 186 104 226 92 C258 82 300 86 326 104 C350 122 356 156 346 192 C336 168 322 158 300 154 C268 148 232 150 206 156 C186 162 174 172 168 190 Z" fill="url(#hair)"/>
    <path d="M190 128 C214 86 286 74 330 108 C312 96 276 90 248 96 C224 102 204 114 190 128 Z" fill="#5A4436" opacity=".75"/>
    <g fill="none" stroke="#6B5141" stroke-width="2.4" stroke-linecap="round" opacity=".55">
      <path d="M200 150 C214 124 238 108 270 102"/><path d="M226 146 C240 124 264 112 296 108"/>
      <path d="M256 148 C270 128 292 118 318 118"/><path d="M182 160 C190 136 206 120 226 110"/>
    </g>
    <path d="M206 98 C236 84 280 82 312 96" fill="none" stroke="#8A6C58" stroke-width="3" stroke-linecap="round" opacity=".45"/>
