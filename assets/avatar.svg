    <path d="M166 250 C172 304 198 344 238 358 C248 362 264 362 274 358 C314 344 340 304 346 250 C340 274 332 292 320 302 C304 292 284 288 256 292 C228 288 208 292 192 302 C180 292 172 274 166 250 Z" fill="url(#beard)"/>
    <g stroke="#4A3528" stroke-width="1.6" stroke-linecap="round" opacity=".45" fill="none">
      <path d="M192 318 l4 9 M206 330 l3 9 M222 340 l2 9 M240 346 l1 8 M272 346 l-1 8 M290 340 l-2 9 M306 330 l-3 9 M320 318 l-4 9 M178 296 l5 9 M334 296 l-5 9 M214 318 l3 8 M298 318 l-3 8 M256 340 l0 10"/>
    </g>
    <!-- moustache -->
    <path d="M218 304 C232 290 248 290 256 296 C264 290 280 290 294 304 C282 302 268 304 256 309 C244 304 230 302 218 304 Z" fill="#1A120D"/>
    <!-- mouth -->
    <path d="M234 320 Q256 330 278 320 Q256 340 234 320 Z" fill="#9A5440"/>
    <path d="M232 319 Q256 331 280 319" fill="none" stroke="#5E2A1C" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M244 334 Q256 338 268 334" fill="none" stroke="#B66A50" stroke-width="2" stroke-linecap="round" opacity=".7"/>

    <!-- nose -->
    <path d="M258 222 C256 248 248 266 243 274 C249 284 264 284 271 276" fill="none" stroke="#8A4E2A" stroke-width="3.2" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="262" cy="244" rx="5" ry="20" fill="#fff" opacity=".18"/>
    <ellipse cx="247" cy="278" rx="4" ry="2.6" fill="#5C2E17" opacity=".6"/>
    <ellipse cx="267" cy="278" rx="4" ry="2.6" fill="#5C2E17" opacity=".6"/>

    <!-- eyes -->
    <g>
      <ellipse cx="212" cy="234" rx="19" ry="11" fill="#FBF8F4"/>
      <circle cx="214" cy="235" r="10.5" fill="url(#iris)"/>
      <circle cx="214" cy="235" r="5" fill="#0E0906"/>
      <circle cx="218" cy="231" r="3.2" fill="#fff"/><circle cx="210" cy="239" r="1.4" fill="#fff" opacity=".8"/>
      <path d="M192 233 C201 222 223 220 233 231" fill="none" stroke="#1A110C" stroke-width="5" stroke-linecap="round"/>
      <path d="M196 244 C206 250 222 250 230 243" fill="none" stroke="#7A4224" stroke-width="1.6" opacity=".6"/>
    </g>
    <g>
      <ellipse cx="300" cy="234" rx="19" ry="11" fill="#FBF8F4"/>
      <circle cx="302" cy="235" r="10.5" fill="url(#iris)"/>
      <circle cx="302" cy="235" r="5" fill="#0E0906"/>
      <circle cx="306" cy="231" r="3.2" fill="#fff"/><circle cx="298" cy="239" r="1.4" fill="#fff" opacity=".8"/>
      <path d="M279 231 C289 220 311 222 320 233" fill="none" stroke="#1A110C" stroke-width="5" stroke-linecap="round"/>
      <path d="M282 243 C290 250 306 250 316 244" fill="none" stroke="#7A4224" stroke-width="1.6" opacity=".6"/>
    </g>
    <!-- eyebrows -->
    <path d="M184 210 C198 196 222 192 242 199 L240 209 C222 204 204 206 188 216 Z" fill="#1C130E"/>
    <path d="M328 210 C314 196 290 192 270 199 L272 209 C290 204 308 206 324 216 Z" fill="#1C130E"/>

    <!-- hair: faded sides, textured top swept up -->
