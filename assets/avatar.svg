    <path d="M158 244 C150 252 152 268 160 274" fill="none" stroke="#7E4524" stroke-width="3" opacity=".6" stroke-linecap="round"/>
    <ellipse cx="352" cy="258" rx="17" ry="29" fill="url(#ear)"/>
    <path d="M354 244 C362 252 360 268 352 274" fill="none" stroke="#7E4524" stroke-width="3" opacity=".6" stroke-linecap="round"/>

